version: "3.9"

# JAG Holdings — production service stack
# PostgreSQL 17 runs natively (not in Docker) — services connect via host.docker.internal.
#
# Reverse proxy:   Caddy (replaces nginx) — TLS via Cloudflare DNS-01 wildcard cert
# Observability:   Loki + Promtail + Grafana (access via SSH tunnel on port 3001)
#
# Public ports: 80 and 443 (Caddy only). Everything else is localhost or internal.

services:

  # ── Caddy — reverse proxy + TLS ──────────────────────────────────────────────
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    image: jag-caddy:latest
    container_name: jag-caddy
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      ACME_EMAIL:           ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy/data:/data
      - /data/caddy/config:/config
      - /var/www/jabco.tt:/var/www/jabco.tt:ro
      - /opt/jag/jag-web/dist:/opt/jag/jag-web/dist:ro
    depends_on:
      keycloak:
        condition: service_healthy
      api:
        condition: service_healthy

  # ── Keycloak 26.x ────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: jag-keycloak
    restart: unless-stopped
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_URL: "https://${KC_HOSTNAME}"
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HTTPS_ENABLED: "false"   # TLS terminated by Caddy
      KC_HEALTH_ENABLED: "true"   # enables /health/ready on management port 9000
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8080:8080"    # admin console via SSH tunnel only — never exposed publicly
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000' 2>/dev/null && exit 0 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 300s           # Keycloak is slow to start on first boot

  # ── JAG Event Dispatcher ─────────────────────────────────────────────────────
  dispatcher:
    build:
      context: ../jag-event-dispatcher
      dockerfile: Dockerfile
    image: jag-event-dispatcher:latest
    container_name: jag-event-dispatcher
    restart: unless-stopped
    environment:
      DATABASE_URL_CORE:          ${DATABASE_URL_CORE}
      DATABASE_URL_COMMERCIAL:    ${DATABASE_URL_COMMERCIAL}
      DATABASE_URL_ENTERTAINMENT: ${DATABASE_URL_ENTERTAINMENT}
      DATABASE_URL_FAMILY:        ${DATABASE_URL_FAMILY}
      DATABASE_URL_PROPERTIES:    ${DATABASE_URL_PROPERTIES}
      ALERT_USER_ID:              ${ALERT_USER_ID}
      POLL_INTERVAL_MS:           "5000"
      BATCH_SIZE:                 "10"
      MAX_RETRIES:                "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f dispatcher || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── JAG API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: ../jag-api
      dockerfile: Dockerfile
    image: jag-api:latest
    container_name: jag-api
    restart: unless-stopped
    environment:
      DATABASE_URL_CORE:          ${DATABASE_URL_CORE}
      DATABASE_URL_COMMERCIAL:    ${DATABASE_URL_COMMERCIAL}
      DATABASE_URL_ENTERTAINMENT: ${DATABASE_URL_ENTERTAINMENT}
      DATABASE_URL_FAMILY:        ${DATABASE_URL_FAMILY}
      DATABASE_URL_PROPERTIES:    ${DATABASE_URL_PROPERTIES}
      KEYCLOAK_URL:               ${KEYCLOAK_URL}
      KEYCLOAK_ISSUER_URL:        ${KEYCLOAK_ISSUER_URL}
      KEYCLOAK_REALM:             ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID:         ${KEYCLOAK_CLIENT_ID}
      WIPAY_WEBHOOK_SECRET:       ${WIPAY_WEBHOOK_SECRET}
      WIPAY_DEFAULT_OWNER_ID:     ${WIPAY_DEFAULT_OWNER_ID}
      MINIO_ENDPOINT:             ${MINIO_ENDPOINT}
      MINIO_PORT:                 ${MINIO_PORT}
      MINIO_USE_SSL:              ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY:           ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY:           ${MINIO_SECRET_KEY}
      MINIO_BUCKET_STATEMENTS:    ${MINIO_BUCKET_STATEMENTS}
      # Found missing 2026-07-08 — lib/minio.ts's presignClient falls back silently
      # to the internal MINIO_ENDPOINT (minio:9000, unreachable from a browser) when
      # these are absent, so every presigned photo/document URL handed to the
      # frontend was broken despite .env having the correct values all along —
      # they were just never wired into this environment block.
      MINIO_PUBLIC_ENDPOINT:      ${MINIO_PUBLIC_ENDPOINT}
      MINIO_PUBLIC_PORT:          ${MINIO_PUBLIC_PORT}
      MINIO_PUBLIC_SSL:           ${MINIO_PUBLIC_SSL}
      PORT:                       "3000"
      NODE_ENV:                   "production"
      TRACCAR_URL:                ${TRACCAR_URL}
      TRACCAR_USER:               ${TRACCAR_USER}
      TRACCAR_PASSWORD:           ${TRACCAR_PASSWORD}
      TRACCAR_EVENT_TOKEN:        ${TRACCAR_EVENT_TOKEN}
      GOOGLE_CALENDAR_ID:             ${GOOGLE_CALENDAR_ID}
      GOOGLE_SERVICE_ACCOUNT_EMAIL:   ${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      GOOGLE_SERVICE_ACCOUNT_KEY:     ${GOOGLE_SERVICE_ACCOUNT_KEY}
      DOCUMENSO_BASE_URL:             ${DOCUMENSO_BASE_URL}
      DOCUMENSO_API_KEY:              ${DOCUMENSO_API_KEY}
      DOCUMENSO_WEBHOOK_SECRET:       ${DOCUMENSO_WEBHOOK_SECRET}
      DOCUMENSO_PUBLIC_BASE_URL:      ${DOCUMENSO_PUBLIC_BASE_URL}
      # Found missing 2026-07-07 while testing lease e-signature — none of these were
      # ever wired into the api container, so every WhatsApp send (rent reminders,
      # viewing reminders, renewal notices, lease signing links, etc.) has been
      # silently no-op'ing in production (lib/whatsapp.ts SEND_SKIP guard).
      WHATSAPP_ACCESS_TOKEN:          ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID:       ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_VERIFY_TOKEN:          ${WHATSAPP_VERIFY_TOKEN}
      # Rent-collection bank details + manager contact used to fill WhatsApp templates
      # (welcome pack, rent reminders, missed-rent, formal demand, legal notice).
      # lib/payment-config.ts reads these — must be listed here or they fall back to
      # code defaults (docker-compose env pass-through gap, see WHATSAPP note above).
      JAG_BANK_ACCOUNT_NAME:          ${JAG_BANK_ACCOUNT_NAME}
      JAG_BANK_NAME:                  ${JAG_BANK_NAME}
      JAG_BANK_ACCOUNT_TYPE:          ${JAG_BANK_ACCOUNT_TYPE}
      JAG_BANK_ACCOUNT_NO:            ${JAG_BANK_ACCOUNT_NO}
      JAG_MANAGER_NAME:               ${JAG_MANAGER_NAME}
      JAG_MANAGER_PHONE:              ${JAG_MANAGER_PHONE}
      JAG_OWNER_PHONE:                ${JAG_OWNER_PHONE}
      PUBLIC_APPLY_BASE_URL:          ${PUBLIC_APPLY_BASE_URL}
    volumes:
      - /opt/jag/jag-api/google-calendar-key.json:/opt/jag/jag-api/google-calendar-key.json:ro
    ports:
      - "127.0.0.1:3000:3000"    # nginx proxies; never expose directly
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ── Traccar — GPS tracking server ─────────────────────────────────────────────
  # Source of truth for vehicle positions / history / geofences / events.
  # Devices (TK918/TK905/JTK905 = tkstar:5013, Q8 = gt06:5023) connect directly
  # over the internet — those ports MUST be opened in the Oracle Security List.
  # Web UI (8082) is localhost-only here; exposed via Caddy at traccar.jagcorporate.com.
  # Config via env (CONFIG_USE_ENVIRONMENT_VARIABLES) so secrets stay in .env (STD-07).
  # DB: native PostgreSQL, dedicated `traccar` database (Traccar runs its own migrations).
  traccar:
    image: traccar/traccar:latest
    container_name: jag-traccar
    restart: unless-stopped
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      LOGGER_CONSOLE: "true"
      DATABASE_DRIVER:   org.postgresql.Driver
      DATABASE_URL:      ${TRACCAR_DB_URL}
      DATABASE_USER:     ${TRACCAR_DB_USER}
      DATABASE_PASSWORD: ${TRACCAR_DB_PASSWORD}
      # Forward device events (geofence/overspeed/SOS) to jag-api → notification bell
      EVENT_FORWARD_URL:    http://api:3000/internal/traccar-event
      EVENT_FORWARD_HEADER: "Authorization: Bearer ${TRACCAR_EVENT_TOKEN}"
    ports:
      - "0.0.0.0:5013:5015"      # host 5013 -> jt808 (TK905B-4G / JTK905B-4G), PUBLIC
      - "0.0.0.0:5023:5093"      # host 5023 -> watch (TK918-4GSA), PUBLIC; Q8/gt06 deferred (needs 3rd port)
      - "127.0.0.1:8082:8082"    # web UI — fronted by Caddy / SSH tunnel
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/api/server || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ── Documenso — self-hosted e-signature ──────────────────────────────────────
  # Replaces DocuSeal (2026-07-07): DocuSeal's free self-hosted edition 404'd
  # "Pro Edition" on create-submission-from-PDF — verified live before switching.
  # Documenso Community Edition (AGPL-3.0) was smoke-tested end-to-end
  # (create-from-PDF → recipient → field → distribute) with no license gate.
  # Documents created via API from jag-api (createSigningSubmission,
  # src/lib/documenso.ts). Tenants/landlord only ever see the returned
  # /sign/<token> signing page — never Documenso's own dashboard/login.
  # DB: native PostgreSQL, dedicated `documenso` database (own migrations on boot).
  # SMTP is intentionally left as the "json" transport (logs only, no real send) —
  # signing links are delivered via our own WhatsApp flow, not Documenso's email.
  documenso:
    image: documenso/documenso:latest
    container_name: jag-documenso
    restart: unless-stopped
    environment:
      NEXT_PRIVATE_DATABASE_URL:           ${DOCUMENSO_DB_URL}
      NEXT_PRIVATE_DIRECT_DATABASE_URL:    ${DOCUMENSO_DB_URL}
      NEXTAUTH_SECRET:                     ${DOCUMENSO_NEXTAUTH_SECRET}
      NEXT_PRIVATE_ENCRYPTION_KEY:         ${DOCUMENSO_ENCRYPTION_KEY}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY}
      NEXTAUTH_URL:                        https://sign.jagcorporate.com
      NEXT_PUBLIC_WEBAPP_URL:              https://sign.jagcorporate.com
      NEXT_PRIVATE_SMTP_TRANSPORT:         json
      NEXT_PRIVATE_SMTP_FROM_NAME:         JAG Properties
      NEXT_PRIVATE_SMTP_FROM_ADDRESS:      robertjohnsonattin@gmail.com
      DOCUMENSO_DISABLE_TELEMETRY:         "true"
      # Set once Robert's owner account existed — blocks new account creation
      # (email/password, Google, Microsoft, OIDC) on this instance going forward.
      NEXT_PUBLIC_DISABLE_SIGNUP:          "true"
    ports:
      - "127.0.0.1:3010:3000"    # fronted by Caddy at sign.jagcorporate.com
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # NOTE: use 127.0.0.1, not localhost — this image has no IPv6 listener and
      # getaddrinfo resolves "localhost" to ::1 first, causing false "unhealthy".
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ── MinIO Object Storage ──────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: jag-minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER:        ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD:    ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER:          "on"
      MINIO_KMS_SECRET_KEY:   ${MINIO_KMS_SECRET_KEY}
      # Required for browser-direct presigned PUT (unit photo upload) to pass its
      # CORS preflight. Found missing 2026-07-08 — the whole storage.jagcorporate.com
      # public-presign path (documented as deployed in session 36) was never actually
      # live: no Caddy site block, no CORS var, no CSP allowance, despite the DNS
      # record existing. Fixing all three together now.
      MINIO_API_CORS_ALLOW_ORIGIN: "https://jagcorporate.com"
    ports:
      - "127.0.0.1:9000:9000"    # S3 API — internal only
      - "127.0.0.1:9001:9001"    # Admin console — access via SSH tunnel
    volumes:
      - /data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ── Loki — Log Aggregation ────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.4
    container_name: jag-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - /data/loki:/data/loki
    ports:
      - "127.0.0.1:3100:3100"    # internal only — Promtail + Grafana connect here
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Promtail — Log Collector ──────────────────────────────────────────────────
  # Reads Docker container logs and native PostgreSQL logs; ships to Loki.
  # Needs access to the Docker socket and the PostgreSQL log directory on the host.
  promtail:
    image: grafana/promtail:3.4
    container_name: jag-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/postgresql:/var/log/postgresql:ro   # PostgreSQL 17 on Ubuntu logs here
    depends_on:
      loki:
        condition: service_healthy

  # ── Grafana — Dashboards ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.6
    container_name: jag-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_HTTP_PORT:        "3001"
      GF_AUTH_ANONYMOUS_ENABLED:  "false"
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_LOG_LEVEL:               "warn"
    ports:
      - "127.0.0.1:3001:3001"    # access via SSH tunnel: ssh -L 3001:localhost:3001 user@vm
    volumes:
      - /data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
