# JAG Holdings — PostgreSQL 16 primary settings for Oracle Ampere VM
# (4 OCPU · 24 GB RAM)
#
# APPLY: After first failover, Ampere becomes the permanent primary.
# Replace the AMD block in /etc/postgresql/16/main/postgresql.conf with this.

# ── Connections ──────────────────────────────────────────────────────────────
max_connections = 200            # more headroom on larger VM

# ── Memory (tuned for 24 GB RAM) ─────────────────────────────────────────────
shared_buffers = 6144MB          # 25% of RAM
effective_cache_size = 18432MB   # 75% of RAM
work_mem = 64MB
maintenance_work_mem = 1024MB
wal_buffers = 64MB

# ── WAL and replication ───────────────────────────────────────────────────────
wal_level = replica
max_wal_senders = 3
wal_keep_size = 512MB
max_replication_slots = 3
hot_standby = on
hot_standby_feedback = on

# ── Checkpoint ───────────────────────────────────────────────────────────────
checkpoint_completion_target = 0.9
min_wal_size = 256MB
max_wal_size = 4GB

# ── Parallelism (4 OCPUs available) ──────────────────────────────────────────
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# ── Logging (same as AMD) ─────────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 500    # tighter threshold — more resources available
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

# ── Security ──────────────────────────────────────────────────────────────────
password_encryption = scram-sha-256
ssl = on
ssl_cert_file = '/etc/ssl/certs/jabco-origin.pem'
ssl_key_file = '/etc/ssl/private/jabco-origin-key.pem'
