# JAG Holdings — PostgreSQL 16 primary settings for Oracle AMD micro VM
# (1 OCPU · 6 GB RAM)
#
# APPLY: Append this block to /etc/postgresql/16/main/postgresql.conf
# then: sudo systemctl reload postgresql
#
# After first failover to Ampere, these settings stay on AMD (now standby).
# The Ampere VM uses primary-ampere.conf when it becomes primary.

# ── Connections ──────────────────────────────────────────────────────────────
max_connections = 100

# ── Memory (tuned for 6 GB RAM) ──────────────────────────────────────────────
shared_buffers = 1536MB          # 25% of RAM
effective_cache_size = 4608MB    # 75% of RAM
work_mem = 16MB                  # per sort/hash — 100 conn × 16 MB = 1.6 GB max
maintenance_work_mem = 256MB
wal_buffers = 16MB

# ── WAL and replication ───────────────────────────────────────────────────────
wal_level = replica              # enables streaming replication
max_wal_senders = 3              # one per standby + headroom
wal_keep_size = 256MB            # keep 256 MB of WAL for standby catch-up
max_replication_slots = 3
hot_standby = on                 # standby serves read-only queries
hot_standby_feedback = on        # standby tells primary about its queries

# Replication mode: async (RPO < 1 s). Upgrade to synchronous for Phase 1:
# synchronous_standby_names = 'ampere'
# synchronous_commit = remote_apply

# ── Checkpoint ───────────────────────────────────────────────────────────────
checkpoint_completion_target = 0.9
min_wal_size = 80MB
max_wal_size = 1GB

# ── Logging ───────────────────────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000   # log queries > 1 s
log_checkpoints = on
log_connections = off               # too noisy with dispatcher polling every 5 s
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

# ── Security ──────────────────────────────────────────────────────────────────
password_encryption = scram-sha-256
ssl = on
ssl_cert_file = '/etc/ssl/certs/jabco-origin.pem'
ssl_key_file = '/etc/ssl/private/jabco-origin-key.pem'
