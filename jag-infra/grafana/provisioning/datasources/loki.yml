# Grafana datasource provisioning — auto-wires Loki on first boot.
# No manual setup required in the Grafana UI.

apiVersion: 1

datasources:
  - name:      Loki
    type:      loki
    access:    proxy
    url:       http://loki:3100
    isDefault: true
    editable:  false
    jsonData:
      maxLines: 1000
      timeout:  60
