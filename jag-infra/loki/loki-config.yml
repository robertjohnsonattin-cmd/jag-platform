# Loki 3.x configuration — JAG Holdings
# Single-tenant mode (auth_enabled: false)
# Storage: local filesystem at /data/loki  (bind-mounted from host)
# Retention: 14 days (336 hours) — enforced by the compactor

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory:  /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store:        tsdb
      object_store: filesystem
      schema:       v13
      index:
        prefix: loki_index_
        period: 24h

limits_config:
  retention_period:          336h   # 14 days
  ingestion_rate_mb:         16
  ingestion_burst_size_mb:   32
  max_query_series:          5000
  max_query_lookback:        336h   # prevent queries past the retention window
  reject_old_samples:        true
  reject_old_samples_max_age: 336h

compactor:
  working_directory:          /data/loki/compactor
  compaction_interval:        10m
  retention_enabled:          true
  delete_request_store:       filesystem
  retention_delete_delay:     2h
  retention_delete_worker_count: 50

ingester:
  wal:
    enabled: true
    dir: /data/loki/wal
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period:     5m
  chunk_retain_period:   30s
  max_transfer_retries:  0
  flush_check_period:    1m

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

ruler:
  alertmanager_url: http://localhost:9093
