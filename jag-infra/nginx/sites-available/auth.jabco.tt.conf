# auth.jabco.tt — Keycloak 26.x (Docker, port 8080)
# KC_PROXY=edge is set in docker-compose.yml — Keycloak trusts X-Forwarded-* headers
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.jabco.tt;

    # Real client IP from Cloudflare
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    # Keycloak tokens and admin responses can be large
    client_max_body_size 10m;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Rate limit login paths more tightly
    location ~ ^/realms/[^/]+/protocol/openid-connect/(token|auth) {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;   # Keycloak admin operations can take time
        proxy_send_timeout    60s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;    # Keycloak uses iframes
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# WebSocket upgrade map (referenced above)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
