# api.jabco.tt — JAG API server (Phase 1 — port 3001)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.jabco.tt;

    # Real client IP from Cloudflare
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    # Body size limit — allow document uploads (10 MB), webhook payloads (1 MB default)
    client_max_body_size 10m;

    # Rate limit: 60 requests/min per IP
    limit_req zone=api burst=20 nodelay;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # WiPay webhook — no rate limit (WiPay controls retry frequency)
    location /api/v1/webhooks/wipay {
        limit_req off;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Preserve raw body for HMAC verification (PRE-5)
        proxy_request_buffering on;
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
