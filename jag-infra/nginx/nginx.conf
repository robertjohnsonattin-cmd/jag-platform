user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;              # don't reveal nginx version

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$http_cf_connecting_ip - [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ── SSL global defaults ───────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cloudflare origin certificate (PRE-7 Step 3.2)
    ssl_certificate     /etc/ssl/certs/jabco-origin.pem;
    ssl_certificate_key /etc/ssl/private/jabco-origin-key.pem;

    # Authenticated Origin Pull — only Cloudflare can reach this server (PRE-7 Step 6)
    ssl_client_certificate /etc/ssl/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client      on;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    limit_req_zone $http_cf_connecting_ip zone=api:10m rate=60r/m;
    limit_req_zone $http_cf_connecting_ip zone=auth:10m rate=20r/m;

    # ── Redirect all HTTP to HTTPS ─────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/sites-enabled/*;
}
