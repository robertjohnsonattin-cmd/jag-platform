  # -------------------------------------------------------
  # WEBHOOKS PATHS
  # -------------------------------------------------------

  /webhooks/wipay:
    post:
      tags: [Webhooks]
      summary: Receive WiPay payment notification
      operationId: receiveWiPayWebhook
      description: >
        Inbound webhook from WiPay for payment events (rent payments, etc).


        **Signature validation:** `X-WiPay-Signature` carries an HMAC-SHA256 signature
        of the raw request body, signed with the shared WiPay webhook secret.
        Requests with missing or invalid signatures are rejected with 401.


        **Idempotency (STD-11):** `Idempotency-Key` required. WiPay may retry failed
        webhook deliveries — duplicate key returns 200 without re-processing.


        **pending_review_queue (decision locked PRE-5):** Non-success payments (`failed`,
        `pending`, `refunded`) and success payments with no matching active lease are
        inserted into `prop_pending_review_queue` and return `202 Accepted`.
        WiPay receives an ACK and does not retry. Robert reviews the queue manually.


        **Auth:** No bearer JWT — WiPay authenticates via HMAC signature only.
      security: []
      parameters:
        - in: header
          name: X-WiPay-Signature
          required: true
          description: "HMAC-SHA256 of the raw request body. Format: `sha256=<hex_digest>`"
          schema:
            type: string
            example: sha256=3ecb2b0b8f0a42d3a7f...
        - in: header
          name: Idempotency-Key
          required: true
          description: UUID supplied by WiPay on all retries of the same event.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WiPayWebhookPayload'
      responses:
        '200':
          description: Webhook received and processed (or already processed — duplicate Idempotency-Key).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WiPayWebhookResponse'
        '400':
          description: Malformed payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error: Missing required field wipay_reference.
                code: VALIDATION_ERROR
        '401':
          description: Invalid or missing HMAC signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error: Webhook signature validation failed.
                code: INVALID_SIGNATURE
        '202':
          description: >
            Event queued for manual review in `prop_pending_review_queue`.
            Returned when payment status is non-success, or when a success payment
            cannot be matched to an active lease. WiPay receives ACK and stops retrying.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WiPayWebhookResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }
